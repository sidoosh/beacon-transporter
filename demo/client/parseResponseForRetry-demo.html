<!DOCTYPE html>
<html>

<head>
    <title>parseResponseForRetry Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
        }

        .success {
            background-color: #4CAF50;
            color: white;
        }

        .retry {
            background-color: #ff9800;
            color: white;
        }

        .error {
            background-color: #f44336;
            color: white;
        }

        .warning {
            background-color: #fd7e14;
            color: white;
        }

        #logs {
            background: #f5f5f5;
            padding: 10px;
            margin: 20px 0;
            height: 300px;
            overflow-y: auto;
        }

        pre {
            margin: 0;
        }
    </style>
</head>

<body>
    <h1>parseResponseForRetry Demo</h1>
    <p>This demo shows how <code>parseResponseForRetry</code> handles partial failures with originalData preservation.
    </p>

    <button id="test-partial-retry" class="retry">Test Partial Retry</button>
    <button id="test-all-success" class="success">Test All Success</button>
    <button id="test-all-failure" class="error">Test All Non-Retryable</button>
    <button id="test-server-error" class="error">Test Server Error (IndexedDB)</button>
    <button id="test-exhaust-retry" class="error">Test Exhaust Retries (IndexedDB)</button>
    <button id="test-success-on-third" class="retry">Test Success on 3rd Persistence</button>
    <button id="test-direct-persist" class="warning">Test Direct to IndexedDB (No In-Memory)</button>
    <button id="test-headers" class="retry">🏷️ Test Headers (502 Retry)</button>
    <button id="test-headers-persist" class="warning">🏷️ Test Headers (500 Persist)</button>
    <button id="test-counter-behavior" class="retry">🔢 Test Counter Behavior (500→RETRYABLE_FAILURE)</button>
    <button id="test-simple-scenario" class="retry">🎯 Simple Scenario (500→RETRYABLE_FAILURE→SUCCESS)</button>
    <button id="reset-simple-scenario" class="warning">🔄 Reset Simple Scenario Counter</button>
    <button id="clear-logs">Clear Logs</button>
    <button id="clear-db">Clear IndexedDB</button>
    <button id="reset-server">Reset Server Counters</button>

    <div style="margin: 20px 0; padding: 15px; background: #e7f3ff; border-left: 4px solid #007bff;">
        <h3>🏷️ Header Testing</h3>
        <p>Custom headers to send with requests:</p>
        <div style="margin: 10px 0;">
            <label>Authorization: </label>
            <input type="text" id="auth-header" value="Bearer demo-token-123" style="width: 200px; padding: 5px;">
        </div>
        <div style="margin: 10px 0;">
            <label>X-Request-ID: </label>
            <input type="text" id="request-id" value="" style="width: 200px; padding: 5px;">
            <button onclick="document.getElementById('request-id').value = 'req_' + Date.now()">Generate</button>
        </div>
        <div style="margin: 10px 0;">
            <label>X-Custom-Header: </label>
            <input type="text" id="custom-header" value="custom-value-123" style="width: 200px; padding: 5px;">
        </div>
    </div>

    <div id="logs"></div>

    <script type="module" src="/dist/bundle.esm.js"></script>
    <script type="module">
        import { createBeacon } from '/dist/bundle.esm.js';

        window.__DEBUG_BEACON_TRANSPORTER = true;
        console.log('Debug flag set:', window.__DEBUG_BEACON_TRANSPORTER);
        console.log('Window object exists:', typeof window !== 'undefined');
        console.log('Debug flag accessible:', window.__DEBUG_BEACON_TRANSPORTER);

        // Debug function is internal - no need to import it

        // Also set on globalThis and self for compatibility
        if (typeof globalThis !== 'undefined') {
            globalThis.__DEBUG_BEACON_TRANSPORTER = true;
        }
        if (typeof self !== 'undefined') {
            self.__DEBUG_BEACON_TRANSPORTER = true;
        }

        const logs = document.getElementById('logs');

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logs.innerHTML += `<pre>[${timestamp}] ${message}</pre>`;
            logs.scrollTop = logs.scrollHeight;
        }

        // Track requests for logging
        let requestCount = 0;

        console.log('Creating beacon...');
        const { beacon, database } = createBeacon({
            inMemoryRetry: {
                attemptLimit: 0, // Disable in-memory retry completely
                statusCodes: [502, 503], // Not used since attemptLimit is 0
                calculateRetryDelay: () => 500, // Not used since attemptLimit is 0
                headerName: 'x-retry-context', // Add header for retry metadata
            },
            persistenceRetry: {
                idbName: 'parseResponseForRetry-demo',
                attemptLimit: 3,
                maxNumber: 10,
                batchEvictionNumber: 3,
                throttleWait: 10000, // 10 seconds for retry
                useIdle: false, // Don't wait for idle time - retry immediately
                statusCodes: [429, 500, 503], // Add 500 to trigger IndexedDB storage
                headerName: 'x-retry-context', // Add header for retry metadata
                onBeforeRetry: (rawPayload) => {
                    log(`🔄 [PERSISTENCE] About to retry: ${rawPayload.substring(0, 100)}...`);
                },
                onResult: (result, rawPayload) => {
                    log(`📊 [PERSISTENCE] Final result: ${result.type}, drop: ${result.drop}, status: ${result.statusCode || 'N/A'}`);
                    if (result.drop) {
                        log(`🗑️ [PERSISTENCE] Entry dropped - should be removed from IndexedDB`);
                    }
                }
            },
            parseResponseForRetry: (responseBody, originalPayload) => {
                try {
                    const response = JSON.parse(responseBody);
                    const originalData = JSON.parse(originalPayload);

                    log(`🔍 parseResponseForRetry called:`);
                    log(`   Original payload: ${originalPayload}`);
                    log(`   Response: ${responseBody}`);

                    // Find items that need retry based on response status
                    const retryableItemIds = response.responses
                        ?.filter(item => item.responseStatus === "ResponseStatus_RETRYABLE_FAILURE")
                        ?.map(item => item.id) || [];

                    log(`   Retryable item IDs: [${retryableItemIds.join(', ')}]`);

                    if (retryableItemIds.length > 0) {
                        // Get the original items that need retry from originalData
                        const itemsToRetry = originalData.items?.filter(originalItem =>
                            retryableItemIds.includes(originalItem.id)
                        ) || [];

                        if (itemsToRetry.length > 0) {
                            const retryPayload = JSON.stringify({ items: itemsToRetry });
                            log(`✅ Retry payload: ${retryPayload}`);
                            return retryPayload;
                        }
                    }

                    log(`❌ No retry needed`);
                    return null; // No retry needed
                } catch (error) {
                    log(`🚨 parseResponseForRetry error: ${error.message}`);
                    return null;
                }
            }
        });

        console.log('Beacon created successfully:', { beacon, database });
        log('✅ Beacon initialized successfully');

        // Create a second beacon with disabled in-memory retry for direct-to-IndexedDB testing
        console.log('Creating direct-persist beacon...');
        const { beacon: directBeacon, database: directDatabase } = createBeacon({
            inMemoryRetry: {
                attemptLimit: 0, // Disable in-memory retries
                statusCodes: [500, 502, 503],
                calculateRetryDelay: () => 500
            },
            persistenceRetry: {
                idbName: 'direct-persist-demo',
                attemptLimit: 3,
                maxNumber: 10,
                batchEvictionNumber: 3,
                throttleWait: 10000, // 10 seconds for retry
                useIdle: false,
                statusCodes: [429, 500, 503],
            },
            parseResponseForRetry: (responseBody, originalPayload) => {
                try {
                    const response = JSON.parse(responseBody);
                    const originalData = JSON.parse(originalPayload);

                    log(`🔍 directBeacon parseResponseForRetry called:`);
                    log(`   Original payload: ${originalPayload}`);
                    log(`   Response: ${responseBody}`);

                    // Find items that need retry based on response status
                    const retryableItemIds = response.responses
                        ?.filter(item => item.responseStatus === "ResponseStatus_RETRYABLE_FAILURE")
                        ?.map(item => item.id) || [];

                    log(`   Retryable item IDs: [${retryableItemIds.join(', ')}]`);

                    if (retryableItemIds.length > 0) {
                        // Get the original items that need retry from originalData
                        const itemsToRetry = originalData.items?.filter(originalItem =>
                            retryableItemIds.includes(originalItem.id)
                        ) || [];

                        if (itemsToRetry.length > 0) {
                            const retryPayload = JSON.stringify({ items: itemsToRetry });
                            log(`✅ Direct beacon retry payload: ${retryPayload}`);
                            return retryPayload;
                        }
                    }

                    log(`❌ No retry needed for direct beacon`);
                    return null; // No retry needed
                } catch (error) {
                    log(`🚨 directBeacon parseResponseForRetry error: ${error.message}`);
                    return null;
                }
            }
        });

        console.log('Direct beacon created successfully:', { directBeacon, directDatabase });
        log('✅ Direct-persist beacon initialized (attemptLimit: 0)');

        // Helper function to reset server counters
        async function resetServerCounters() {
            try {
                await fetch('/api/reset', { method: 'POST' });
                log('🔄 Server counters reset');
            } catch (error) {
                log(`⚠️ Failed to reset server counters: ${error.message}`);
            }
        }

        // Test scenarios
        document.getElementById('test-partial-retry').addEventListener('click', async () => {
            requestCount = 0;
            await resetServerCounters();
            log('🚀 Starting Partial Retry Test (will test IndexedDB persistence)...');
            log('💡 First request: mixed success/failure, then retries will exhaust and persist to IndexedDB');

            try {
                const result = await beacon('/api/partial-retry', JSON.stringify({
                    items: [
                        { id: "item1", data: "success_data", timestamp: Date.now() },
                        { id: "item2", data: "retry_data", timestamp: Date.now() },
                        { id: "item3", data: "fail_data", timestamp: Date.now() }
                    ]
                }));

                if (result.drop) {
                    log('💾 ✅ Partial retry request stored in IndexedDB! Check DevTools > Application > IndexedDB');
                    log('⏰ Waiting 10 seconds before retry...');

                    // Set up a timer to check if retry happens
                    setTimeout(() => {
                        log('⏰ 10 seconds passed - retry should have happened by now');
                        log('🔍 Check console for [beacon-transporter] debug logs');
                    }, 11000);
                }

                log(`✅ Final result: ${JSON.stringify(result)}`);
            } catch (error) {
                log(`🚨 Error: ${error.message}`);
            }
        });

        document.getElementById('test-all-success').addEventListener('click', async () => {
            requestCount = 0;
            log('🚀 Starting All Success Test...');

            try {
                const result = await beacon('/api/all-success', JSON.stringify({
                    items: [
                        { id: "item1", data: "success_data_1" },
                        { id: "item2", data: "success_data_2" },
                        { id: "item3", data: "success_data_3" }
                    ]
                }));
                log(`✅ Final result: ${JSON.stringify(result)}`);
            } catch (error) {
                log(`🚨 Error: ${error.message}`);
            }
        });

        document.getElementById('test-all-failure').addEventListener('click', async () => {
            requestCount = 0;
            log('🚀 Starting All Non-Retryable Failure Test...');

            try {
                const result = await beacon('/api/all-non-retryable', JSON.stringify({
                    items: [
                        { id: "item1", data: "failure_data_1" },
                        { id: "item2", data: "failure_data_2" },
                        { id: "item3", data: "failure_data_3" }
                    ]
                }));
                log(`✅ Final result: ${JSON.stringify(result)}`);
            } catch (error) {
                log(`🚨 Error: ${error.message}`);
            }
        });

        document.getElementById('test-server-error').addEventListener('click', async () => {
            requestCount = 0;
            log('🚀 Starting Server Error Test (will trigger IndexedDB persistence)...');
            log('💾 Watch for "drop":true in result - this means stored in IndexedDB');
            log('🕐 After storage, beacon will wait 10 seconds before retry');

            try {
                const result = await beacon('/api/server-error', JSON.stringify({
                    items: [
                        { id: "error1", data: "will_fail_data", timestamp: Date.now() },
                        { id: "error2", data: "also_fail_data", timestamp: Date.now() }
                    ]
                }));

                if (result.drop) {
                    log('💾 ✅ Request stored in IndexedDB! Check DevTools > Application > IndexedDB');
                    log('⏰ Waiting 10 seconds before retry...');

                    // Set up a timer to check if retry happens
                    setTimeout(() => {
                        log('⏰ 10 seconds passed - retry should have happened by now');
                        log('🔍 Check console for [beacon-transporter] debug logs');
                    }, 11000);
                }

                log(`✅ Final result: ${JSON.stringify(result)}`);
            } catch (error) {
                log(`🚨 Error: ${error.message}`);
            }
        });

        document.getElementById('test-exhaust-retry').addEventListener('click', async () => {
            await resetServerCounters();
            requestCount = 0;
            log('🚀 Starting Exhaust Retries Test (will exhaust in-memory then use IndexedDB)...');
            log('💡 Expected: 2 in-memory retries → store in IndexedDB → 3 persistence retries → drop');
            log('🔧 Config: inMemory.attemptLimit=2, persistence.attemptLimit=3');

            try {
                const result = await beacon('/api/exhaust-retry', JSON.stringify({
                    items: [
                        { id: "item1", data: "retry_data_1", timestamp: Date.now() },
                        { id: "item2", data: "retry_data_2", timestamp: Date.now() }
                    ]
                }));

                log(`✅ Immediate result: ${JSON.stringify(result)}`);

                if (result.drop === false && result.type === 'persisted') {
                    log(`💾 Entry stored in IndexedDB - watch for background retries every 10 seconds`);
                    log(`🔍 Expected: 3 persistence attempts (1,2,3) then entry should be dropped`);
                } else {
                    log(`⚠️ Unexpected result - entry not persisted as expected`);
                }
            } catch (error) {
                log(`🚨 Error: ${error.message}`);
            }
        });

        document.getElementById('test-direct-persist').addEventListener('click', async () => {
            requestCount = 0;
            await resetServerCounters();
            log('🚀 Starting Direct-to-IndexedDB Test (No In-Memory Retry)...');
            log('💡 This beacon has attemptLimit: 0, so 500 errors go directly to IndexedDB');

            try {
                const result = await directBeacon('/api/direct-persist', JSON.stringify({
                    items: [
                        { id: "direct1", data: "direct_data_1", timestamp: Date.now() },
                        { id: "direct2", data: "direct_data_2", timestamp: Date.now() }
                    ]
                }));

                if (result.drop) {
                    log('💾 ✅ Request stored directly in IndexedDB! Check DevTools > Application > IndexedDB > direct-persist-demo');
                    log('⏰ Waiting 5 seconds before retry...');

                    // Set up a timer to check if retry happens
                    setTimeout(() => {
                        log('⏰ 5 seconds passed - retry should have happened by now');
                        log('🔍 Check console for [beacon-transporter] debug logs');
                    }, 6000);
                }

                log(`✅ Final result: ${JSON.stringify(result)}`);
            } catch (error) {
                log(`🚨 Error: ${error.message}`);
            }
        });

        document.getElementById('test-success-on-third').addEventListener('click', async () => {
            requestCount = 0;
            await resetServerCounters();
            log('🚀 Starting Success on 3rd Persistence Test...');
            log('📋 This will: 3 in-memory retries → 2 persistence failures → SUCCESS on 3rd persistence');

            try {
                const result = await beacon('/api/success-on-third-persistence', JSON.stringify({
                    items: [
                        { id: "item1", data: "success_data", timestamp: Date.now() },
                        { id: "item2", data: "retry_data", timestamp: Date.now() },
                        { id: "item3", data: "fail_data", timestamp: Date.now() }
                    ]
                }));

                if (result.drop) {
                    log('💾 ✅ Request stored in IndexedDB after in-memory exhaustion!');
                    log('⏰ Watch for persistence retries: attemptCount 0 → 1 → 2 → SUCCESS');
                    log('🔍 Check console for [PERSISTENCE] debug logs');
                }

                log(`✅ Final result: ${JSON.stringify(result)}`);
            } catch (error) {
                log(`🚨 Error: ${error.message}`);
            }
        });

        document.getElementById('clear-logs').addEventListener('click', () => {
            logs.innerHTML = '';
        });

        document.getElementById('clear-db').addEventListener('click', async () => {
            try {
                await database.clearQueue();
                await directDatabase.clearQueue();
                log('🗑️ Both IndexedDB databases cleared successfully');
            } catch (error) {
                log(`🚨 Error clearing IndexedDB: ${error.message}`);
            }
        });

        document.getElementById('reset-server').addEventListener('click', async () => {
            await resetServerCounters();
        });

        // Header testing functions
        function getCustomHeaders() {
            const headers = {};

            const auth = document.getElementById('auth-header').value.trim();
            if (auth) headers['Authorization'] = auth;

            const requestId = document.getElementById('request-id').value.trim();
            if (requestId) headers['X-Request-ID'] = requestId;

            const custom = document.getElementById('custom-header').value.trim();
            if (custom) headers['X-Custom-Header'] = custom;

            return headers;
        }

        // Test headers with in-memory retry (502)
        document.getElementById('test-headers').addEventListener('click', async () => {
            const headers = getCustomHeaders();
            log('🏷️ Testing Headers with In-Memory Retry (502)');
            log(`📤 Custom headers: ${JSON.stringify(headers)}`);
            log('🔄 This will trigger in-memory retries with header preservation');

            try {
                const result = await beacon('/api/header-test/502', JSON.stringify({
                    test: 'header-test-502',
                    timestamp: Date.now(),
                    headers: Object.keys(headers)
                }), headers);

                log(`✅ Header test result: ${JSON.stringify(result)}`);
                log('🔍 Check server logs to see received headers with retry context');
            } catch (error) {
                log(`🚨 Header test error: ${error.message}`);
            }
        });

        // Test headers with persistent retry (500)
        document.getElementById('test-headers-persist').addEventListener('click', async () => {
            const headers = getCustomHeaders();
            log('🏷️ Testing Headers with Persistent Retry (500)');
            log(`📤 Custom headers: ${JSON.stringify(headers)}`);
            log('💾 This will store headers in IndexedDB and restore during retry');

            try {
                const result = await beacon('/api/header-test/500', JSON.stringify({
                    test: 'header-test-500',
                    timestamp: Date.now(),
                    headers: Object.keys(headers)
                }), headers);

                log(`✅ Header persist test result: ${JSON.stringify(result)}`);
                log('🔍 Headers should be preserved in IndexedDB and restored during replay');

                if (result.drop) {
                    log('💾 ✅ Request with headers stored in IndexedDB!');
                    log('⏰ Watch for retry with preserved headers in server logs');
                }
            } catch (error) {
                log(`🚨 Header persist test error: ${error.message}`);
            }
        });

        // Test counter behavior: 500 errors then RETRYABLE_FAILURE
        document.getElementById('test-counter-behavior').addEventListener('click', async () => {
            // Reset ONLY the counter-behavior-test endpoint counter
            try {
                await fetch('/api/reset-counter-behavior', { method: 'POST' });
                log('🔄 Reset counter-behavior-test endpoint counter only');
            } catch (error) {
                log(`⚠️ Failed to reset counter: ${error.message}`);
            }

            requestCount = 0;
            log('🔢 Starting Counter Behavior Test...');
            log('📋 Simplified scenario (no in-memory retry):');
            log('   Request 1: 500 error → Direct to persistence (attemptCount: 1)');
            log('   Request 2: 200 RETRYABLE_FAILURE → Persistence retry (attemptCount: 2) ← KEY TEST');
            log('   Request 3: 200 SUCCESS → Final attempt (attemptCount: 3)');
            log('🔧 Config: inMemory.attemptLimit=0 (DISABLED), persistence.attemptLimit=3');
            log('🔧 In-memory retry: COMPLETELY DISABLED');
            log('🔧 Persistence status codes: [429, 500, 503]');

            try {
                const result = await beacon('/api/counter-behavior-test', JSON.stringify({
                    items: [
                        { id: "counter1", data: "test_counter_behavior", timestamp: Date.now() },
                        { id: "counter2", data: "test_counter_behavior", timestamp: Date.now() }
                    ]
                }));

                log(`✅ Initial result: ${JSON.stringify(result)}`);

                if (result.drop === false && result.type === 'persisted') {
                    log(`💾 Entry stored in IndexedDB after in-memory exhaustion`);
                    log(`🔍 Watch for the complete retry sequence:`);
                    log(`   - In-memory 1: 500 error → retry in 500ms`);
                    log(`   - In-memory 2: 500 error → exhausted, go to persistence`);
                    log(`   - Persistence 1: 500 error → attemptCount: 1`);
                    log(`   - Persistence 2: RETRYABLE_FAILURE → attemptCount: 2 (NOT reset!)`);
                    log(`   - Persistence 3: SUCCESS → attemptCount: 3`);
                    log(`⏰ Each persistence attempt waits 10 seconds due to throttle`);
                } else {
                    log(`⚠️ Unexpected result - entry not persisted as expected`);
                }
            } catch (error) {
                log(`🚨 Error: ${error.message}`);
            }
        });

        // Simple scenario test: 500 → RETRYABLE_FAILURE → SUCCESS
        document.getElementById('test-simple-scenario').addEventListener('click', async () => {
            // DON'T reset counter - we need continuous sequence across retries
            requestCount = 0;
            log('🎯 Starting Simple Scenario Test...');
            log('📋 Expected sequence:');
            log('   Call 1: 500 error → Direct to persistence (attemptCount: 1)');
            log('   Call 2: 200 RETRYABLE_FAILURE → Persistence retry (attemptCount: 2) ← KEY TEST');
            log('   Call 3: 200 SUCCESS → Final attempt (attemptCount: 3)');
            log('🔧 This tests if counter continues: 1 → 2 → 3 (not reset)');

            try {
                const result = await beacon('/api/simple-scenario', JSON.stringify({
                    items: [
                        { id: "item1", data: "simple_test_data", timestamp: Date.now() },
                        { id: "item2", data: "simple_test_data", timestamp: Date.now() }
                    ]
                }));

                log(`✅ Initial result: ${JSON.stringify(result)}`);

                if (result.drop === false && result.type === 'persisted') {
                    log(`💾 Entry stored in IndexedDB after 500 error`);
                    log(`🔍 Watch server logs for:`);
                    log(`   - Call 2: attemptCount should be 1`);
                    log(`   - Call 3: attemptCount should be 2 (NOT reset to 1!)`);
                    log(`⏰ Persistence retries happen every 10 seconds`);
                } else {
                    log(`⚠️ Unexpected result: ${JSON.stringify(result)}`);
                }
            } catch (error) {
                log(`🚨 Error: ${error.message}`);
            }
        });

        // Manual reset for simple scenario
        document.getElementById('reset-simple-scenario').addEventListener('click', async () => {
            try {
                await fetch('/api/reset-simple-scenario', { method: 'POST' });
                log('🔄 Simple scenario counter reset - ready for fresh test');
            } catch (error) {
                log(`⚠️ Failed to reset simple scenario counter: ${error.message}`);
            }
        });

        // Initialize request ID
        document.getElementById('request-id').value = 'req_' + Date.now();

        log('📋 Demo ready! Click the buttons to test different scenarios.');
        log('💡 Use "Test Server Error" to see IndexedDB persistence in action!');
        log('🎯 Try "Test Success on 3rd Persistence" to see the full retry cycle!');
        log('🏷️ NEW: Use header test buttons to verify header preservation!');
        log('🔢 NEW: Use "Counter Behavior" test to verify attempt counter continuation!');
        log('🎯 NEW: Use "Simple Scenario" test for clean 500→RETRYABLE_FAILURE→SUCCESS flow!');
        log('🔍 Check DevTools > Application > IndexedDB to see the database.');
    </script>
</body>

</html>
